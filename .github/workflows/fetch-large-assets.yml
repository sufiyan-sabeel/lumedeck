name: Fetch large binary assets

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download large binary assets
        run: |
          set -euo pipefail
          mkdir -p app/assets app/android/app/src/main/jniLibs/arm64-v8a
          curl -fsSL -o app/assets/bootstrap-aarch64.zip \
            https://raw.githubusercontent.com/orailnoor/DroidDesk/main/app/assets/bootstrap-aarch64.zip
          curl -fsSL -o app/android/app/src/main/jniLibs/arm64-v8a/libXlorie.so \
            https://raw.githubusercontent.com/orailnoor/DroidDesk/main/app/android/app/src/main/jniLibs/arm64-v8a/libXlorie.so
      - name: Commit assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/assets/bootstrap-aarch64.zip app/android/app/src/main/jniLibs/arm64-v8a/libXlorie.so
          git diff --cached --quiet || git commit -m "Add large binary assets (bootstrap rootfs, libXlorie)"
          git push
