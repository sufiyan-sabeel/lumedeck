name: Build & Release APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: Install NDK required by Flutter
        run: |
          NDK=$(grep -rhoE 'ndkVersion[^"]*"[0-9]+\.[0-9]+\.[0-9]+"' "$FLUTTER_ROOT/packages/flutter_tools/gradle" 2>/dev/null \
                | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -u | tail -1)
          echo "Detected Flutter NDK version: ${NDK:-<none>}"
          if [ -n "$NDK" ]; then
            SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
            yes | "$SDKMANAGER" --install "ndk;$NDK" > /dev/null 2>&1 || true
          fi

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64

      - name: Show build output
        run: ls -lh app/build/app/outputs/flutter-apk/

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumedroid-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1
          name: Lumedroid v1.3.1
          body: |
            **Lumedroid 1.3.1** - full Linux desktop for Android.

            Release APK built from the `lumedeck` project (arm64-v8a).
          files: app/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
